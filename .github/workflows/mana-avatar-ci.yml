name: MANA Avatar Asset Build

on:
  push:
    branches: [mana-avatar-voice-server]
    paths:
      - "tools/build_mana_avatar.py"
      - ".github/workflows/mana-avatar-ci.yml"
  pull_request:
    paths:
      - "tools/build_mana_avatar.py"
      - ".github/workflows/mana-avatar-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-avatar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Generate original MANA avatar GLB
        run: |
          mkdir -p assets
          blender --background --python tools/build_mana_avatar.py -- --output assets/mana_avatar.glb
          test -s assets/mana_avatar.glb
      - name: Validate GLB container
        run: |
          python3 - <<'PY'
          import pathlib, struct
          p = pathlib.Path("assets/mana_avatar.glb")
          data = p.read_bytes()
          assert len(data) > 4096, f"GLB too small: {len(data)} bytes"
          magic, version, declared = struct.unpack_from("<4sII", data, 0)
          assert magic == b"glTF", f"bad GLB magic: {magic!r}"
          assert version == 2, f"expected glTF 2.0, got {version}"
          assert declared == len(data), f"length mismatch: {declared} != {len(data)}"
          print(f"Valid GLB 2.0: {len(data)} bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MANA-original-avatar-GLB
          path: assets/mana_avatar.glb
          if-no-files-found: error
          retention-days: 30
