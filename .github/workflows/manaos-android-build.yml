name: ManaOS Android APK Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manaos-android-build.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: manaos-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/korumart13-commits/MANA-Genesis-4.0./main/MANA_Genesis_4_0_MIRROR_READY_SOURCE%282%29.zip" \
            -o source/manaos-source.zip
          unzip -q source/manaos-source.zip -d source/unpacked

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          # Select the intended unified Android project, never a historical sample.
          WRAPPER="$(find "$GITHUB_WORKSPACE/source/unpacked" -type f -path '*/existing_aosp/MANA_OS_3_0_Android_Project/gradlew' -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "Expected project existing_aosp/MANA_OS_3_0_Android_Project was not found."
            find "$GITHUB_WORKSPACE/source/unpacked" -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Selected directory has no Gradle settings file: $PROJECT_DIR"
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$WRAPPER"
          echo "Using project: $PROJECT_DIR"

      - name: Repair malformed welcome string in source copy
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          file = Path("app/src/main/java/com/mana/os/app/MainActivity.kt")
          source = file.read_text(encoding="utf-8")
          broken = 'base("MANA", "Первоначальная настройка\nЯ стану твоим главным интерфейсом, сохраняя Android в качестве системной основы.")'
          fixed = 'base("MANA", "Первоначальная настройка. Я стану твоим главным интерфейсом, сохраняя Android в качестве системной основы.")'

          if broken in source:
              source = source.replace(broken, fixed, 1)
              file.write_text(source, encoding="utf-8")
              print("Fixed the broken multiline Kotlin string.")
          elif fixed in source:
              print("Welcome string is already fixed; no change needed.")
          else:
              raise SystemExit("Expected welcome string was not found; refusing to patch an unrelated source file.")

          check = file.read_text(encoding="utf-8")
          if fixed not in check:
              raise SystemExit("Post-patch verification failed.")
          print("Post-patch verification passed.")

          PY
      - name: Verify repaired Kotlin source
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/mana/os/app/MainActivity.kt"
          echo "----- $FILE lines 45-70 -----"
          nl -ba "$FILE" | sed -n '45,70p'
          echo "----- end source excerpt -----"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --continue --stacktrace assembleDebug

      - name: Collect APKs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          find "${{ steps.project.outputs.dir }}" -type f -path "*/build/outputs/apk/*/*.apk" -exec cp {} "$GITHUB_WORKSPACE/output/" \;
          test -n "$(find "$GITHUB_WORKSPACE/output" -type f -name '*.apk' -print -quit)"

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ManaOS-debug-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
