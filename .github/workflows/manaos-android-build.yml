name: ManaOS Android APK Build

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "docs/**"
      - "integration/**"
      - "tools/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "docs/**"
      - "integration/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manaos-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, analyze and build ManaOS debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6

      - name: Compile MANA tooling and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/mana_code_intelligence.py \
            tools/mana_ai_code_author.py \
            tools/mana_patch_gate.py \
            tools/mana_build_quality_gate.py \
            tools/prepare_android_project.py
          python3 -m unittest discover -s tools/tests -v

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and unpack the MANA source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --location --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/korumart13-commits/MANA-Genesis-4.0./main/MANA_Genesis_4_0_MIRROR_READY_SOURCE%282%29.zip" \
            --output source/manaos-source.zip
          test -s source/manaos-source.zip
          unzip -q source/manaos-source.zip -d source/unpacked

      - name: Locate the intended Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(find "$GITHUB_WORKSPACE/source/unpacked" -type f -path '*/existing_aosp/MANA_OS_3_0_Android_Project/gradlew' -print -quit)"
          if [ -z "$wrapper" ]; then
            echo "Expected unified MANA Android project was not found in the source archive."
            find "$GITHUB_WORKSPACE/source/unpacked" -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print | head -200
            exit 1
          fi
          project_dir="$(dirname "$wrapper")"
          if [ ! -f "$project_dir/settings.gradle" ] && [ ! -f "$project_dir/settings.gradle.kts" ]; then
            echo "The selected directory has no Gradle settings file: $project_dir"
            exit 1
          fi
          chmod +x "$wrapper"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Using Android project: $project_dir"

      - name: Integrate MANA runtime and dashboard into the temporary source copy
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          python3 tools/prepare_android_project.py \
            --project-dir "$PROJECT_DIR" \
            --integration-dir "$GITHUB_WORKSPACE/integration" \
            --license-file "$GITHUB_WORKSPACE/docs/MANAOS_PERSONAL_LICENSE_1.0.md"

      - name: Create source inventory and audit archive
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p source-audit
          {
            echo "# MANA Android source inventory"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Project: $PROJECT_DIR"
            echo
            echo "## Gradle modules"
            grep -R --include='settings.gradle' --include='settings.gradle.kts' -nE 'include|project\(' "$PROJECT_DIR" || true
            echo
            echo "## Kotlin, Java, AIDL, manifests and Gradle files"
            find "$PROJECT_DIR" -type f \( -name '*.kt' -o -name '*.java' -o -name '*.aidl' -o -name 'AndroidManifest.xml' -o -name '*.gradle' -o -name '*.gradle.kts' \) -not -path '*/build/*' | sort
          } > source-audit/MANAOS_SOURCE_INVENTORY.md
          tar -czf source-audit/MANAOS_ANDROID_SOURCE.tar.gz \
            --exclude='*/build' --exclude='.gradle' -C "$PROJECT_DIR" .
          test -s source-audit/MANAOS_SOURCE_INVENTORY.md
          test -s source-audit/MANAOS_ANDROID_SOURCE.tar.gz

      - name: Upload source audit package
        uses: actions/upload-artifact@v4
        with:
          name: ManaOS-source-audit
          path: source-audit/*
          if-no-files-found: error
          retention-days: 14

      - name: Run read-only MANA Code Intelligence
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          python3 tools/mana_code_intelligence.py \
            --source "$PROJECT_DIR" \
            --out code-intelligence
          test -s code-intelligence/MANA_CODE_INTELLIGENCE.json
          test -s code-intelligence/MANA_CODE_INTELLIGENCE.md

      - name: Upload MANA Code Intelligence report
        uses: actions/upload-artifact@v4
        with:
          name: ManaOS-code-intelligence
          path: code-intelligence/*
          if-no-files-found: error
          retention-days: 14

      - name: Draft optional AI code proposal (review only)
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          MANA_AI_API_KEY: ${{ secrets.MANA_AI_API_KEY }}
          MANA_AI_MODEL: ${{ vars.MANA_AI_MODEL }}
          MANA_AI_API_URL: ${{ vars.MANA_AI_API_URL }}
        run: |
          set -euo pipefail
          python3 tools/mana_ai_code_author.py \
            --report code-intelligence/MANA_CODE_INTELLIGENCE.json \
            --source "$PROJECT_DIR" \
            --out ai-code-author
          test -s ai-code-author/MANA_AI_PATCH_REQUEST.md
          test -s ai-code-author/MANA_AI_AUTHOR_REPORT.md

      - name: Upload MANA AI Code Author proposal
        uses: actions/upload-artifact@v4
        with:
          name: ManaOS-ai-code-author
          path: ai-code-author/*
          if-no-files-found: error
          retention-days: 14

      - name: Run Android unit tests and assemble debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace test assembleDebug

      - name: Evaluate build and static-analysis evidence
        if: always()
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -s code-intelligence/MANA_CODE_INTELLIGENCE.json ]; then
            python3 tools/mana_build_quality_gate.py \
              --tests "$PROJECT_DIR" \
              --analysis code-intelligence/MANA_CODE_INTELLIGENCE.json \
              --out quality-gate
          else
            mkdir -p quality-gate
            printf '%s\n' '{"status":"NEEDS_REVIEW","reason":"Static analysis did not complete; no build approval is implied."}' > quality-gate/MANA_BUILD_QUALITY.json
            printf '%s\n' '# MANA Build Quality Gate' '' '- Status: NEEDS_REVIEW' '- Static analysis did not complete.' > quality-gate/MANA_BUILD_QUALITY.md
          fi

      - name: Collect debug APK
        if: success()
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p output
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} output/ \;
          test -n "$(find output -type f -name '*.apk' -print -quit)"

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ManaOS-debug-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports and quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ManaOS-build-evidence
          path: |
            quality-gate/*
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14
