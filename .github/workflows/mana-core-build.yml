name: MANA Core Build
on:
  push:
    branches: [mana-avatar-voice-server]
    paths:
      - "mana-core/**"
      - ".github/workflows/mana-core-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run tests and build
        working-directory: mana-core
        run: gradle clean test build
      - name: Package standalone core
        run: |
          mkdir -p dist
          zip -r dist/MANA_Core_4.0_Source.zip mana-core
      - uses: actions/upload-artifact@v4
        with:
          name: MANA-Core-4.0
          path: |
            dist/MANA_Core_4.0_Source.zip
            mana-core/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
