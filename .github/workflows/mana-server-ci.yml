name: MANA Gateway CI

on:
  push:
    branches: [mana-avatar-voice-server]
    paths:
      - "server/**"
      - ".github/workflows/mana-server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/mana-server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile server
        run: python -m compileall -q app tests voice_app.py
      - name: Run gateway contract tests
        run: python -m unittest discover -s tests -v
