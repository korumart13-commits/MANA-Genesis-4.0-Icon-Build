<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
canvas{display:block;width:100%;height:100%}#status{position:absolute;inset:auto 0 4px;text-align:center;color:#8fb7dc;font:10px sans-serif;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./examples/jsm/"}}</script></head>
<body><canvas id="fallback"></canvas><div id="status">Загружаю аватар Маны…</div>
<script>
(()=>{const c=document.getElementById('fallback'),x=c.getContext('2d');function draw(){const w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;x.clearRect(0,0,w,h);x.save();x.scale(devicePixelRatio,devicePixelRatio);const W=c.clientWidth,H=c.clientHeight,cx=W/2,cy=H*.47,s=Math.min(W/190,H/220);x.translate(cx,cy);x.scale(s,s);
const glow=x.createRadialGradient(0,0,8,0,0,105);glow.addColorStop(0,'rgba(46,155,255,.32)');glow.addColorStop(1,'rgba(10,30,65,0)');x.fillStyle=glow;x.beginPath();x.arc(0,0,110,0,Math.PI*2);x.fill();
// hair back
x.fillStyle='#101827';x.beginPath();x.moveTo(-52,-62);x.quadraticCurveTo(-78,-95,-58,-130);x.quadraticCurveTo(-15,-157,38,-126);x.quadraticCurveTo(77,-93,55,-37);x.lineTo(49,93);x.quadraticCurveTo(5,120,-48,88);x.closePath();x.fill();
// shoulders and outfit
const coat=x.createLinearGradient(-55,65,55,150);coat.addColorStop(0,'#172d4b');coat.addColorStop(1,'#070f20');x.fillStyle=coat;x.beginPath();x.moveTo(-35,55);x.quadraticCurveTo(-74,65,-77,142);x.lineTo(77,142);x.quadraticCurveTo(72,65,35,55);x.closePath();x.fill();x.strokeStyle='#3c9be5';x.lineWidth=2;x.beginPath();x.moveTo(0,72);x.lineTo(0,140);x.stroke();
// neck
x.fillStyle='#f0c9c0';x.fillRect(-12,43,24,28);
// face
const skin=x.createLinearGradient(-40,-50,42,48);skin.addColorStop(0,'#ffe0d8');skin.addColorStop(1,'#dca9a6');x.fillStyle=skin;x.beginPath();x.ellipse(0,-18,39,53,0,0,Math.PI*2);x.fill();
// fringe
x.fillStyle='#111827';x.beginPath();x.moveTo(-39,-35);x.quadraticCurveTo(-50,-93,3,-91);x.quadraticCurveTo(49,-89,42,-35);x.quadraticCurveTo(20,-57,5,-51);x.quadraticCurveTo(-13,-67,-39,-35);x.fill();
// eyes
x.fillStyle='#152943';x.beginPath();x.ellipse(-15,-12,5,8,0,0,Math.PI*2);x.ellipse(15,-12,5,8,0,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-16,-15,1.8,0,Math.PI*2);x.arc(14,-15,1.8,0,Math.PI*2);x.fill();
// blush and smile
x.fillStyle='rgba(238,125,145,.25)';x.beginPath();x.ellipse(-25,9,8,4,0,0,Math.PI*2);x.ellipse(25,9,8,4,0,0,Math.PI*2);x.fill();x.strokeStyle='#a95e70';x.lineWidth=1.5;x.beginPath();x.arc(0,10,7,.2,Math.PI-.2);x.stroke();
// side locks
x.fillStyle='#111827';x.beginPath();x.moveTo(-37,-40);x.quadraticCurveTo(-58,10,-42,75);x.quadraticCurveTo(-27,52,-30,7);x.fill();x.beginPath();x.moveTo(37,-40);x.quadraticCurveTo(58,10,42,75);x.quadraticCurveTo(27,52,30,7);x.fill();
x.restore()}draw();addEventListener('resize',draw);window.ManaAvatar={setSpeaking(v){this.setPresenceState(v?'SPEAKING':'IDLE','')},setPresenceState(state,detail){const active=['LISTENING','THINKING','SPEAKING','ATTENTION'].includes(state);c.style.filter=active?'drop-shadow(0 0 9px #45c5ff)':'none';const label={IDLE:'',LISTENING:'Слушаю…',THINKING:'Думаю…',SPEAKING:'Говорю…',ATTENTION:'Внимание',PAUSED:'Пауза',ERROR:'Ошибка'}[state]||'';status.textContent=detail||label}};})();
</script>
<script type="module">
const status=document.getElementById('status');
try{
 const THREE=await import('three');const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,.1,30);camera.position.set(0,-3.1,1.12);camera.lookAt(0,0,1);
 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0x000000,0);document.body.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xc9e8ff,0x14233c,2));const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(2,-3,4);scene.add(key);const rim=new THREE.DirectionalLight(0x42baff,1.1);rim.position.set(-2,2,2);scene.add(rim);
 let mixer,avatar;const loader=new GLTFLoader();loader.load('./mana_avatar.glb',g=>{avatar=g.scene;scene.add(avatar);avatar.scale.setScalar(.98);const box=new THREE.Box3().setFromObject(avatar),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());avatar.position.sub(center);camera.position.set(0,-Math.max(size.x,size.y)*2.8,size.z*.55);camera.lookAt(0,0,0);mixer=new THREE.AnimationMixer(avatar);if(g.animations.length)mixer.clipAction(g.animations[0]).play();document.getElementById('fallback').style.display='none';status.textContent='';},undefined,e=>{status.textContent='3D недоступно — показан резервный аватар';console.warn(e)});
 function resize(){let w=Math.max(1,innerWidth),h=Math.max(1,innerHeight);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}addEventListener('resize',resize);resize();let prev=performance.now();function frame(t){requestAnimationFrame(frame);if(mixer)mixer.update(Math.min((t-prev)/1000,.05));prev=t;if(avatar)avatar.rotation.z=Math.sin(t/2600)*.025;renderer.render(scene,camera)}requestAnimationFrame(frame);
}catch(e){status.textContent='Локальный аватар MANA';console.warn(e)}
</script></body></html>
